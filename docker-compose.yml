services:
  ai:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sandworm-net
    command: uvicorn src.__main__:app --host 0.0.0.0 --port 8000 --reload

networks:
  sandworm-net:
    external: true
