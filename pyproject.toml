[tool.poetry]
name = "sandworm-ai-service"
version = "0.1.0"
description = "AI execution service for Sandworm blockchain analytics notebooks"
authors = ["Sandworm Devs <dev@sandwormlabs.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12.*, <3.13"
fastapi = "^0.135.2"
uvicorn = { extras = ["standard"], version = "^0.42.0" }
pydantic-settings = "^2.5.2"
httpx = "^0.28.0"
qdrant-client = "^1.17.1"
pyyaml = "^6.0.3"
redis = {extras = ["asyncio"], version = "^8.0.0"}
jsonschema = "^4.26.0"
pydantic-ai-slim = {extras = ["openai"], version = "^2.54.0"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.8"
pre-commit = "^4.5.1"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
